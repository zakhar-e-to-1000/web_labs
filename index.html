<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Document</title>
</head>

<body>
    <section class="container">
        <form action="" class="create">
            <h2>Add film</h2>
            <label for="name">Name</label>
            <input required id="name" type="text" required>
            <label for="duration">Duration in minutes</label>
            <input required id="duration" type="number" min="0">
            <label for="reviews">Number of IMDB reviews</label>
            <input required id="reviews" type="number" min="0">
            <button id="create-film" type="button">Add</button>
        </form>
        <form action="" class="search">
            <label for="search-name">Enter name:</label>
            <input type="text" id="search-name">
            <button type="button">Search</button>
        </form>
    </section>
    <section class="container">
        <ul id="film-container">
        </ul>
    </section>
    <section class="container"></section>
    <script type="module" src="js/index.js"></script>
</body>

</html>
