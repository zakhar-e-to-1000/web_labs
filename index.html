<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Document</title>
</head>

<body>
    <header class="header">
        <div class="container container--header">
            <buttton class="header__create">Create new recipe</buttton>
            <h1 class="header__title">Film list</h1>
            <form>
                <input class="header__search" placeholder="search bar" type="text">
            </form>
        </div>
    </header>
    <section class="header__sort-pannel">
        <div class="container container--sort">
            <button class="header__sort">Sorted</button>
        </div>
    </section>
    <main class="main">
        <div class="container container--main">
            <div class="film-view">
                <h2 class="film-view__title">Films:</h2>
                <div class="film-grid" id="film-grid"></div>
            </div>
            <div class="film-create open"></div>
            <div class="film-edit"></div>
        </div>
    </main>
    <script type="module" src="js/index.js"></script>
</body>

</html>
